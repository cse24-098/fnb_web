<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <link href="login.css" rel="stylesheet">
    <title>Sign Up - Absa Bank</title>
</head>
<body>
    <!-- ========================================== -->
    <!-- SIGNUP PAGE                              -->
    <!-- ========================================== -->
    <div class="login-page">
        <div class="login-card signup-card">
            <!-- Logo -->
            <div class="login-logo">
                <img src="images/absa_logo.png" alt="Absa Logo">
                <h1>Absa Bank</h1>
            </div>

            <!-- Welcome Message -->
            <h2>Create Account</h2>
            <p class="login-subtitle">Join thousands of happy customers</p>

            <!-- Signup Form -->
            <form class="login-form" id="signupForm">
                <!-- Full Name -->
                <div class="form-group">
                    <label for="signupName">
                        <i class="fas fa-user"></i> Full Name
                    </label>
                    <input 
                        type="text" 
                        id="signupName" 
                        placeholder="Enter your full name" 
                        required 
                    />
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="signupEmail">
                        <i class="fas fa-envelope"></i> Email Address
                    </label>
                    <input 
                        type="email" 
                        id="signupEmail" 
                        placeholder="Enter your email" 
                        required 
                    />
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="signupPassword">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="signupPassword" 
                            placeholder="Create a password" 
                            required 
                        />
                        <button type="button" class="toggle-password" id="toggleSignupPassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="signupConfirmPassword">
                        <i class="fas fa-check-circle"></i> Confirm Password
                    </label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="signupConfirmPassword" 
                            placeholder="Confirm your password" 
                            required 
                        />
                        <button type="button" class="toggle-password" id="toggleSignupConfirmPassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Terms -->
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" required /> I agree to the 
                        <a href="#" class="terms-link">Terms of Service</a> and 
                        <a href="#" class="terms-link">Privacy Policy</a>
                    </label>
                </div>

                <!-- Signup Button -->
                <button type="submit" class="login-btn">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </form>

            <!-- Divider -->
            <div class="divider">
                <span>or continue with</span>
            </div>

            <!-- Social Login -->
            <div class="social-login">
                <button class="social-btn google">
                    <i class="fa-brands fa-google"></i> Google
                </button>
                <button class="social-btn facebook">
                    <i class="fa-brands fa-facebook"></i> Facebook
                </button>
            </div>

            <!-- Login Link -->
            <p class="signup-link">
                Already have an account? <a href="login.html">Sign In</a>
            </p>
        </div>

        <!-- Back to Home -->
        <a href="index.html" class="back-home">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>
    </div>

    <script src="script.js"></script>
</body>
</html>
